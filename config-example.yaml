# MintFV Configuration File
# Copy this file to 'config.yaml' and adjust the values

# Domain and Email for Let's Encrypt
domain: mintfv.example.com
email: admin@example.com

# Let's Encrypt Settings
letsencrypt:
  # Use staging environment (true) or production (false)
  # Always start with staging=true to avoid rate limits!
  staging: true
  # Interval for automatic certificate renewal checks (e.g., 12h, 24h, 7d)
  renewal_interval: 12h

# Service Configuration
services:
  # Nginx Webserver
  nginx:
    enabled: true
    user_id: 2001
    group_id: 2100
    memory_limit: 128M
    cpu_limit: 0.5

  # Certbot (Let's Encrypt Client)
  certbot:
    enabled: true
    user_id: 2002
    group_id: 2100
    memory_limit: 64M
    cpu_limit: 0.25

  # Mosquitto MQTT Broker (future)
  mosquitto:
    enabled: false
    user_id: 2003
    group_id: 2100
    memory_limit: 64M
    cpu_limit: 0.25

  # Node-RED (Data Processing, future)
  nodered:
    enabled: false
    user_id: 2004
    group_id: 2100
    memory_limit: 256M
    cpu_limit: 0.5

  # InfluxDB (Time Series Database, future)
  influxdb:
    enabled: false
    user_id: 2005
    group_id: 2100
    memory_limit: 512M
    cpu_limit: 1.0

  # Grafana (Visualization, future)
  grafana:
    enabled: false
    user_id: 2006
    group_id: 2100
    memory_limit: 256M
    cpu_limit: 0.5

# Logging Configuration
logging:
  # Maximum size of a single log file before rotation
  max_size: 10m
  # Maximum number of log files to keep
  max_files: 3
  # Compress rotated log files
  compress: true

# Timezone
timezone: Europe/Berlin
