# MintFV Configuration File
#
# WICHTIG: Kopiere diese Datei nach 'config.yaml' und passe die Werte an:
#   cp config-example.yaml config.yaml
#   nano config.yaml
#
# Die config.yaml wird NICHT ins Git committed (siehe .gitignore)

# ============================================================================
# Domain und Email (für Let's Encrypt SSL-Zertifikate)
# ============================================================================

# Deine öffentliche Domain - muss via DNS auf deinen Server zeigen
# Beispiel: mintfv.example.com oder subdomain.example.com
domain: mintfv.example.com

# Email für Let's Encrypt Benachrichtigungen (Zertifikat-Ablauf etc.)
# WICHTIG: Muss eine gültige, erreichbare Email-Adresse sein!
email: admin@example.com

# ============================================================================
# Let's Encrypt Einstellungen
# ============================================================================

letsencrypt:
  # Staging Modus (true = Test-Zertifikate, false = Produktiv)
  #
  # IMMER MIT staging=true STARTEN!
  # - Test-Zertifikate sind nicht vertrauenswürdig (Browser-Warnung)
  # - ABER: Keine Rate-Limits (unbegrenzt viele Requests)
  # - Erst nach erfolgreichem Test auf staging=false umstellen
  #
  # Rate Limits (Production):
  # - 50 Zertifikate pro Domain pro Woche
  # - 5 doppelte Zertifikate pro Woche
  #
  # Siehe: https://letsencrypt.org/docs/rate-limits/
  staging: true

  # Intervall für automatische Zertifikat-Erneuerung
  # Optionen: 12h, 24h, 7d, 30d
  # Empfohlen: 12h (prüft 2x täglich, erneuert nur wenn <30 Tage gültig)
  renewal_interval: 12h

# ============================================================================
# Service-Konfiguration
# ============================================================================
#
# Jeder Service hat folgende Parameter:
# - enabled: Service aktivieren (true) oder deaktivieren (false)
# - user_id/group_id: Linux UID/GID für Permissions (siehe DOCKER.md)
# - memory_limit: RAM-Limit (K=KB, M=MB, G=GB)
# - cpu_limit: CPU-Kerne (0.5 = halber Kern, 1.0 = ganzer Kern)
#
# WICHTIG: UIDs 2001-2006 sind reserviert (siehe DOCKER.md)
# Alle Services teilen GID 2100 (ssl-certs Gruppe)

services:
  # --------------------------------------------------------------------------
  # Nginx Webserver & Reverse Proxy
  # --------------------------------------------------------------------------
  # Funktion: HTTP/HTTPS Server, SSL-Termination, Reverse Proxy zu Services
  # Port: 80 (HTTP redirect), 443 (HTTPS)
  # Abhängigkeiten: Benötigt certbot für SSL-Zertifikate
  nginx:
    enabled: true
    user_id: 2001
    group_id: 2100
    memory_limit: 128M
    cpu_limit: 0.5

  # --------------------------------------------------------------------------
  # Certbot (Let's Encrypt Client)
  # --------------------------------------------------------------------------
  # Funktion: SSL-Zertifikate erstellen und automatisch erneuern
  # Läuft als Cron-Job (siehe letsencrypt.renewal_interval)
  # WICHTIG: Muss zusammen mit nginx aktiviert sein!
  certbot:
    enabled: true
    user_id: 2002
    group_id: 2100
    memory_limit: 64M
    cpu_limit: 0.25

  # --------------------------------------------------------------------------
  # Mosquitto MQTT Broker (geplant)
  # --------------------------------------------------------------------------
  # Funktion: MQTT Message Broker für IoT-Geräte
  # Port: 1883 (MQTT), 9001 (WebSocket)
  # Status: Noch nicht implementiert
  mosquitto:
    enabled: false
    user_id: 2003
    group_id: 2100
    memory_limit: 64M
    cpu_limit: 0.25

  # --------------------------------------------------------------------------
  # Node-RED (Flow-basierte Programmierung)
  # --------------------------------------------------------------------------
  # Funktion: Visuelle Programmierung für IoT/Automation
  # Port: 1880 (intern), via nginx: /nodered/
  # Zugriff: https://[domain]/nodered/
  # WICHTIG: Standard ohne Login! Siehe NODERED.md für Security-Setup
  nodered:
    enabled: false
    user_id: 2004
    group_id: 2100
    memory_limit: 256M       # Erhöhen bei vielen Flows (bis 512M)
    cpu_limit: 0.5          # Erhöhen bei CPU-intensiven Flows (bis 1.0)

  # --------------------------------------------------------------------------
  # InfluxDB 3 Core (Time-Series Datenbank)
  # --------------------------------------------------------------------------
  # Funktion: Zeitreihen-Datenbank für Sensor-Daten, Metriken, Logs
  # Port: 8181 (intern), via nginx: /influxdb/
  # API: v1 (InfluxQL), v2 (Compatibility), v3 (Native)
  # WICHTIG: Keine Web-UI! Nutze Grafana oder CLI
  influxdb:
    enabled: false
    user_id: 2005
    group_id: 2100
    memory_limit: 512M       # Minimum! Erhöhen für große Datenmengen (bis 2G)
    cpu_limit: 1.0          # 1 Kern minimum für gute Performance

  # --------------------------------------------------------------------------
  # Grafana (Visualisierung & Dashboards)
  # --------------------------------------------------------------------------
  # Funktion: Dashboards, Charts, Alerting für Time-Series Daten
  # Port: 3000 (intern), via nginx: /grafana/
  # Zugriff: https://[domain]/grafana/
  # Default Login: admin / admin (beim ersten Login ändern!)
  grafana:
    enabled: false
    user_id: 2006
    group_id: 2100
    memory_limit: 256M       # Erhöhen bei vielen Dashboards (bis 512M)
    cpu_limit: 0.5          # Erhöhen bei vielen gleichzeitigen Usern

# ============================================================================
# Logging-Konfiguration
# ============================================================================
#
# Log-Rotation für alle Services (nginx, certbot, etc.)
# Verhindert volle Festplatten durch zu große Log-Dateien

logging:
  # Maximale Größe einer einzelnen Log-Datei vor Rotation
  # Optionen: 1m, 5m, 10m, 50m, 100m
  # Empfohlen: 10m (bei normalem Traffic)
  max_size: 10m

  # Anzahl der aufzubewahrenden rotierten Log-Dateien
  # Beispiel: 3 = access.log + access.log.1 + access.log.2 + access.log.3
  # Ältere Dateien werden gelöscht
  max_files: 3

  # Rotierte Log-Dateien komprimieren (gzip)
  # true = spart viel Speicherplatz (~90% Kompression)
  # false = Dateien bleiben lesbar, aber größer
  compress: true

# ============================================================================
# Timezone
# ============================================================================
#
# Legt die Zeitzone für alle Container fest
# Wichtig für korrekte Timestamps in Logs und Datenbank
#
# Optionen:
# - Europe/Berlin (Deutschland)
# - Europe/Zurich (Schweiz)
# - Europe/Vienna (Österreich)
# - UTC (Koordinierte Weltzeit, kein Sommer/Winterzeit)
#
# Liste aller Zeitzonen: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: Europe/Berlin
