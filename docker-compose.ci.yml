services:
  nginx:
    image: nginx:1.29.4-alpine
    expose:
      - "8080"
      - "8443"
    command: /bin/sh -c "mkdir -p /usr/share/nginx/html && echo '<html><body>CI nginx</body></html>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - mintfv-ci-network

networks:
  mintfv-ci-network:
    name: mintfv_ci_network
    driver: bridge
