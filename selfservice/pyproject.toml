[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # do not perform function calls in argument defaults (Flask patterns)
]
exclude = ["__pycache__", ".mypy_cache"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert in tests OK

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "flask_sqlalchemy.*",
    "flask_login.*",
    "flask_wtf.*",
    "flask_limiter.*",
    "wtforms.*",
    "itsdangerous.*",
    "passlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pylint.messages_control]
disable = [
    # Docstrings: in Flask-View-Funktionen und Datenmodellen nicht üblich
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Flask Application-Factory-Pattern: Imports inside create_app() sind Absicht
    "import-outside-toplevel",
    # Flask Blueprint-Pattern: `from . import routes` am Dateiende ist Pflicht
    "wrong-import-position",
    # Cyclic imports durch Blueprint-Registrierung sind in Flask normal
    "cyclic-import",
    # SQLAlchemy-Modell-Klassen haben bewusst keine eigenen Public Methods
    "too-few-public-methods",
    # Kleine Codemengen-Duplikate in ähnlichen Forms-Klassen akzeptiert
    "duplicate-code",
    # broad-exception-caught: In Flask-Routen ist catch-all für Resilience nötig
    "broad-exception-caught",
]

[tool.pylint.format]
max-line-length = 100
