# ============================================================================
# MintFV Mosquitto MQTT Broker Configuration
# Multi-Tenant Setup with Authentication
# ============================================================================

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# Alternative: autosave_on_changes true (I/O-intensiv, aber maximale Sicherheit)

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Debug-Logging für ACL-Tests (in Produktion ausschalten!)
# Aktivieren mit: log_type all
# log_type debug
# log_type subscribe
# log_type unsubscribe

# Connection messages für fail2ban
connection_messages true

# ============================================================================
# WICHTIG: Global Auth für alle Listener!
# ============================================================================
per_listener_settings false


# ============================================================================
# ============================================================================
# SECURITY - Multi-Tenant Authentifizierung & ACLs
# ============================================================================
# WICHTIG: ACL-Validierung erfolgt NUR über Broker-Logs!
# Client-Return-Codes (QoS 0) zeigen IMMER SUCCESS - auch bei ACL-Deny!
#
# Validierung:
#   docker compose logs -f mosquitto | grep -E "(Received|Denied)"
#
# Dokumentation:
#   - MOSQUITTO.md: ACL Testing & Validation
#   - TROUBLESHOOTING-ACL.md: Häufige Probleme und Lösungen
#   - test-acl.sh: Automatisierte ACL-Tests

allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl

# ============================================================================
# Listener 1: Native MQTT (Port 1883)
# ============================================================================
listener 1883 0.0.0.0
protocol mqtt


# ============================================================================
# Listener 2: WebSocket (Port 9001)
# ============================================================================
listener 9001 0.0.0.0
protocol websockets

# Security
max_connections -1
max_queued_messages 1000
max_packet_size 268435456