name: CI

on:
  push:
    branches: [ refactorPED ]
  pull_request:
    branches: [ refactorPED ]

jobs:
  lint:
    name: Python lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selfservice/requirements-dev.txt
      - name: Ruff check
        run: |
          ruff check selfservice
      - name: Mypy
        run: |
          # Use the selfservice pyproject.toml so mypy picks up ignore_missing_imports
          mypy --config-file selfservice/pyproject.toml selfservice

  node-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for Playwright fallback
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install test dependencies
        working-directory: tests
        run: |
          # Use npm install to be robust when lockfile is not present
          npm install
          npx playwright install --with-deps

      - name: Create missing env files for compose
        run: |
          # Some services expect local env files (not checked into repo).
          # Create minimal placeholders so `docker compose up` doesn't fail.
          if [ ! -f .env.smtp.password ]; then
            echo "# SMTP password for CI (placeholder)" > .env.smtp.password
            echo "SMTP_PASSWORD=" >> .env.smtp.password
          fi

      - name: Start docker-compose services
        run: |
          set -o pipefail
          if docker compose up -d --build; then
            echo "COMPOSE_OK=1" >> $GITHUB_ENV
          else
            echo "COMPOSE_OK=0" >> $GITHUB_ENV
            echo "docker compose failed; continuing with local smoke test fallback"
          fi

      - name: Wait for services
        run: |
          docker compose ps || true

      - name: Run Playwright smoke tests (compose or fallback)
        run: |
          chmod +x ./tests/run-tests.sh
          if [ "${COMPOSE_OK:-0}" = "1" ]; then
            echo "Running tests inside docker-compose network"
            ./tests/run-tests.sh smoke
          else
            echo "Compose unavailable; running isolated Playwright smoke test"
            cd tests
            npx playwright test specs/smoke.spec.ts --project=chromium --reporter=github --timeout=60000
          fi

      - name: Gather docker-compose logs
        if: always()
        run: |
          mkdir -p ci-logs
          echo "=== docker compose ps ===" > ci-logs/compose-ps.log || true
          docker compose ps >> ci-logs/compose-ps.log || true
          echo "=== mosquitto log ===" > ci-logs/mosquitto.log || true
          docker compose logs --no-color --tail=500 mosquitto >> ci-logs/mosquitto.log || true
          echo "=== influxdb log ===" > ci-logs/influxdb.log || true
          docker compose logs --no-color --tail=500 influxdb >> ci-logs/influxdb.log || true
          echo "=== selfservice log ===" > ci-logs/selfservice.log || true
          docker compose logs --no-color --tail=200 selfservice >> ci-logs/selfservice.log || true

      - name: Upload compose logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: ci-logs


  node-smoke-lite:
    name: Playwright smoke tests (CI-light)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for Playwright fallback
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install test dependencies
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps

      - name: Create missing env files for compose
        run: |
          if [ ! -f .env.smtp.password ]; then
            echo "# SMTP password for CI (placeholder)" > .env.smtp.password
            echo "SMTP_PASSWORD=" >> .env.smtp.password
          fi

      - name: Start docker-compose (CI override)
        run: |
          set -o pipefail
          if docker compose -f docker-compose.ci.yml up -d --build; then
            echo "COMPOSE_OK=1" >> $GITHUB_ENV
          else
            echo "COMPOSE_OK=0" >> $GITHUB_ENV
            echo "docker compose (ci override) failed; continuing with local smoke test fallback"
          fi

      - name: Wait for services
        run: |
          docker compose -f docker-compose.ci.yml ps || true

      - name: Run Playwright smoke tests (ci override or fallback)
        run: |
          chmod +x ./tests/run-tests.sh
          if [ "${COMPOSE_OK:-0}" = "1" ]; then
            echo "Running tests inside docker-compose.ci.yml network"
            ./tests/run-tests.sh smoke
          else
            echo "Compose unavailable; running isolated Playwright smoke test"
            cd tests
            npx playwright test specs/smoke.spec.ts --project=chromium --reporter=github --timeout=60000
          fi

      - name: Gather docker-compose.ci logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.ci.yml ps > ci-logs/compose-ps.log || true
          docker compose -f docker-compose.ci.yml logs --no-color --tail=500 nginx > ci-logs/nginx.log || true

      - name: Upload compose.ci logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-ci-logs
          path: ci-logs
