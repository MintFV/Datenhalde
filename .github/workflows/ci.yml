name: CI

on:
  push:
    branches: [ refactorPED ]
  pull_request:
    branches: [ refactorPED ]

jobs:
  lint:
    name: Python lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selfservice/requirements-dev.txt
      - name: Ruff check
        run: |
          ruff check selfservice
      - name: Mypy
        run: |
          mypy selfservice

  node-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: tests
        run: npm ci
      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps
      - name: Run smoke test
        working-directory: tests
        run: npx playwright test specs/smoke.spec.ts --project=chromium --reporter=github --timeout=60000
