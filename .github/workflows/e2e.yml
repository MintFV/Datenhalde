name: E2E (manual)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Manual E2E (docker-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services (docker compose)
        run: |
          docker compose up -d --build nginx certbot influxdb mosquitto nodered selfservice smtp-relay grafana

      - name: Wait for services
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/grafana/api/health >/dev/null 2>&1; then
              echo "services ready"
              exit 0
            fi
            sleep 5
          done
          echo "services not ready in time"
          exit 1

      - name: Run Playwright tests
        run: |
          cd tests
          ./run-tests.sh

      - name: Teardown
        if: always()
        run: |
          docker compose down -v
