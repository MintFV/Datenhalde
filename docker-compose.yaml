# Shared Configuration Templates
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Init Container: Creates initial dummy SSL certificates
  certbot-init:
    image: certbot/certbot:latest
    container_name: mintfv-certbot-init
    # Run as root initially to create directories, then chown
    # user: "2002:2100"
    group_add:
      - "2100"

    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/logs:/var/log/letsencrypt:rw

    environment:
      - DOMAIN=${DOMAIN:-mintfv.peddy.net}
      - EMAIL=${EMAIL:-admin@example.com}
      - STAGING=${STAGING:-1}
      - TZ=${TZ:-Europe/Berlin}

    entrypoint: /bin/sh
    command: >
      -c '
      echo "=== Certbot Init Container ===" &&
      echo "Domain: $${DOMAIN}" &&
      echo "Staging: $${STAGING}" &&

      if [ ! -f "/etc/letsencrypt/live/$${DOMAIN}/fullchain.pem" ]; then
        echo "Creating dummy certificate for $${DOMAIN}..." &&
        mkdir -p /etc/letsencrypt/live/$${DOMAIN} &&
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
          -keyout /etc/letsencrypt/live/$${DOMAIN}/privkey.pem \
          -out /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem \
          -subj "/CN=localhost" &&
        chown -R 2002:2100 /etc/letsencrypt &&
        touch /etc/letsencrypt/.initialized &&
        echo "Dummy certificate created successfully"
      else
        echo "Certificate already exists, skipping initialization" &&
        touch /etc/letsencrypt/.initialized
      fi &&
      echo "Init complete"
      '

    <<: *default-security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    healthcheck:
      test: ["CMD", "test", "-f", "/etc/letsencrypt/.initialized"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 5s

    logging: *default-logging

    networks:
      - mintfv-network

  # Nginx Webserver
  nginx:
    image: nginx:alpine
    container_name: mintfv-nginx
    restart: unless-stopped
    user: "2001:2100"
    group_add:
      - "2100"

    depends_on:
      certbot-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
      # grafana:
      #   condition: service_started
      # influxdb:
      #   condition: service_healthy

    ports:
      # # IPv4 explizit angeben mit 0.0.0.0:
      - "0.0.0.0:80:8080"      # HTTP (redirect to HTTPS)
      - "0.0.0.0:443:8443"     # HTTPS
      - "0.0.0.0:8883:8883"    # MQTTS (via Stream Module)
    volumes:
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/stream.conf:/etc/nginx/mqtt.conf:ro  # MQTT TLS stream config
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

    tmpfs:
      - /var/cache/nginx:uid=2001,gid=2100,mode=0750
      - /var/run:uid=2001,gid=2100,mode=0750
      - /tmp:uid=2001,gid=2100,mode=1777

    read_only: true

    <<: *default-security
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 64M

    environment:
      - TZ=${TZ:-Europe/Berlin}
      - NGINX_HOST=${DOMAIN:-localhost}
      - NGINX_PORT=8080

    healthcheck:
      test: ["CMD", "curl", "-fsS4", "--max-time", "5", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging: *default-logging

    networks:
      - mintfv-network

  # Certbot: Automatic SSL certificate renewal
  certbot:
    image: certbot/certbot:latest
    container_name: mintfv-certbot
    restart: unless-stopped
    user: "2002:2100"
    group_add:
      - "2100"

    depends_on:
      nginx:
        condition: service_healthy
      certbot-init:
        condition: service_completed_successfully

    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/logs:/var/log/letsencrypt:rw
      - ./certbot/lib:/var/lib/letsencrypt:rw

    environment:
      - TZ=${TZ:-Europe/Berlin}
      - STAGING=${STAGING:-1}
      - RENEWAL_INTERVAL=${RENEWAL_INTERVAL:-12h}

    entrypoint: /bin/sh
    command:
      - -c
      - |
        STAGING_FLAG=""
        if [ "$${STAGING}" = "1" ]; then
          STAGING_FLAG="--staging"
          echo "[$(date)] Certbot: Using Let's Encrypt STAGING environment"
        else
          echo "[$(date)] Certbot: Using Let's Encrypt PRODUCTION environment"
        fi

        trap exit TERM
        while :; do
          echo "[$(date)] Running certificate renewal check..."
          certbot renew \
            --webroot \
            --webroot-path=/var/www/certbot \
            --quiet \
            $${STAGING_FLAG} \
            --deploy-hook "echo Certificate renewed at $(date)" || true
          echo "[$(date)] Next renewal check in $${RENEWAL_INTERVAL}"
          sleep $${RENEWAL_INTERVAL} & wait $${!}
        done

    <<: *default-security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    healthcheck:
      test: ["CMD-SHELL", "certbot --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
          pids: 50

    logging: *default-logging

    networks:
      - mintfv-network

  # =============================================================================
  # Grafana Visualization
  # =============================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: mintfv-grafana
    restart: unless-stopped
    user: "2006:2100"
    group_add:
      - "2100"

    environment:
      # Run Grafana in /grafana/ subdirectory
      - GF_SERVER_ROOT_URL=https://mintfv.peddy.net/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Security
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Logging to STDOUT/STDERR
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      # Disable analytics
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Database (default SQLite in /var/lib/grafana)
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      # Leeren String = alle deaktiviert
      - GF_FEATURE_TOGGLES_ENABLE=
      - GF_FEATURE_MANAGEMENT_OFREP_ENABLED=false

    volumes:
      - ./grafana/data:/var/lib/grafana

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS4 --max-time 2 http://localhost:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

    <<: *default-security
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    read_only: true
    tmpfs:
      - /tmp:uid=2006,gid=2100,mode=1700
      - /var/lib/grafana/plugins:uid=2006,gid=2100,mode=0755

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100

    logging: *default-logging

    networks:
      - mintfv-network

    depends_on:
      influxdb:
        condition: service_healthy
      nginx:
        condition: service_healthy

  # =============================================================================
  # InfluxDB 3 Core Time Series Database
  # =============================================================================

  influxdb:
    image: influxdb:3-core
    container_name: mintfv-influxdb
    restart: unless-stopped
    user: "2005:2100"
    group_add:
      - "2100"
    expose:
      - "8181"  # Nur im internen Netzwerk erreichbar
    command:
      - influxdb3
      - serve
      - --node-id=mintfv-node-0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --http-bind=0.0.0.0:8181
      - --disable-authz=health,ping
      - --admin-token-file=/var/lib/influxdb3/tokens/admin.token

    volumes:
      - ./influxdb/data:/var/lib/influxdb3/data
      - ./influxdb/plugins:/var/lib/influxdb3/plugins
      - ./influxdb/tokens:/var/lib/influxdb3/tokens:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS4 --max-time 2 http://localhost:8181/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    <<: *default-security
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    read_only: true
    tmpfs:
      - /tmp:uid=2005,gid=2100,mode=1700

    deploy:
      resources:
        limits:
          cpus: '2.0'      # Statt 1.0
          memory: 1024M    # Statt 512M
          pids: 200
        reservations:
          cpus: '1.0'
          memory: 512M

    logging: *default-logging

    networks:
      - mintfv-network

  # =============================================================================
  # IoT & Messaging Services
  # =============================================================================

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mintfv-mosquitto
    restart: unless-stopped
    user: "2003:2100"
    group_add:
      - "2100"

    ports:
      # IPv4 explizit angeben mit 0.0.0.0:
      - "0.0.0.0:1883:1883"    # MQTT
    expose:
      - "9001"    # WebSocket nur intern, via nginx

    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/logs:/mosquitto/log:rw

    <<: *default-security

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging: *default-logging

    networks:
      - mintfv-network

  # Node-RED: Flow-based development tool for IoT and automation
  nodered:
    image: nodered/node-red:latest
    container_name: mintfv-nodered
    restart: unless-stopped
    user: "2004:2100"
    group_add:
      - "2100"
    env_file:
      - .env
    # Oder explizit:
    # environment:
    #   - NODE_RED_ADMIN_USER=${NODE_RED_ADMIN_USER}
    #   - NODE_RED_ADMIN_PASSWORD_HASH=${NODE_RED_ADMIN_PASSWORD_HASH}
    #   - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}

    depends_on:
      influxdb:
        condition: service_healthy

    environment:
      - TZ=${TZ:-Europe/Berlin}
      - NODE_RED_ENABLE_SAFE_MODE=false
      - NODE_RED_ENABLE_PROJECTS=false

    volumes:
      - ./nodered/data:/data:rw

    <<: *default-security

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS4 --max-time 5 http://localhost:1880/nodered/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    logging: *default-logging

    networks:
      - mintfv-network


# Networks
networks:
  mintfv-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
