# MQTT over TLS (Port 8883)
stream {
    # Log-Format für MQTT Stream
    log_format mqtt_access '$remote_addr [$time_local] '
                           '$protocol $status $bytes_sent $bytes_received '
                           '$session_time "$upstream_addr" '
                           '$upstream_bytes_sent $upstream_bytes_received '
                           '$upstream_connect_time';

    # MQTT Backend (Native MQTT Port 1883 im Container)
    upstream mqtt_backend {
        server mosquitto:1883;
    }

    server {
        listen 8883 ssl;
        proxy_pass mqtt_backend;

        # Logging
        access_log /dev/stdout mqtt_access;
        # error_log /dev/stderr notice;
        error_log /dev/stderr debug;

        # SSL Zertifikate (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/mintfv.peddy.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mintfv.peddy.net/privkey.pem;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Session Cache
        ssl_session_cache shared:MQTT_SSL:10m;
        ssl_session_timeout 10m;

        # Timeouts für Long-Running MQTT Connections
        proxy_timeout 7d;               # MQTT Clients können 7 Tage connected bleiben
        proxy_connect_timeout 20s;      # Initial connection timeout
    }
}
