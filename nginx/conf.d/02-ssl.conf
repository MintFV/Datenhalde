# SSL-enabled nginx configuration for MintFV
# With Let's Encrypt support


server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # DNS resolver für Docker (127.0.0.11 ist Docker's embedded DNS)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/mintfv.peddy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mintfv.peddy.net/privkey.pem;


    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header_inherit merge;  # ← GLOBAL aktivieren - ab v1.29.3
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://catalogue.nodered.org; frame-ancestors 'self';" always;

    # Hide nginx version
    server_tokens off;

    # ======================================================================
    # SECURITY LOGIC & ACTION
    # ======================================================================

    ## Initialize variables for this request
    # set $log_reason "";  # set $block_request 0; ---> set in nginx/conf.d/00-security-maps.conf


    # Check URI length (8KB = 8192 bytes)
    if ($request_uri ~ "^.{8192,}") {
        set $log_reason "uri_too_long";
        set $block_request 1;
    }

    # Block HTTP/1.0 (old bots)
    if ($server_protocol = "HTTP/1.0") {
        set $log_reason "http_1.0";
        set $block_request 1;
    }

    # Map-based checks (fast, for exact matches on raw data)
    if ($is_bad_bot)      { set $log_reason "bad_bot";      set $block_request 1; }
    if ($is_bad_uri)      { set $log_reason "bad_uri";      set $block_request 1; }
    if ($is_exploit_uri)  { set $log_reason "exploit_uri";  set $block_request 1; }
    if ($is_bad_signature){ set $log_reason "bad_signature";set $block_request 1; }

    # Pattern-based checks (slower, but works on DECODED variables)
    include /etc/nginx/include.d/security_if_rules.conf;

    # Additional check: Block suspicious HTTP methods
    if ($request_method !~ ^(GET|POST|HEAD)$ ) {
        set $log_reason "bad_method";
        set $block_request 1;
    }

    # Define logging behavior
    access_log /dev/stdout security if=$block_request;
    access_log /dev/stdout combined if=$log_standard_traffic;
    error_log /dev/stderr warn;   # Hier detaillierter, als global in nginx.conf

    # Perform the final action - block if flagged
    if ($block_request) { return 444; }

    # Entferne Backend-Header die Informationen leaken
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;
    proxy_hide_header X-Runtime;

    # global rate limiting
    limit_req zone=general burst=30 nodelay;


    # ======================================================================
    # LOCATION BLOCKS
    # ======================================================================

    # Grafana
    location /grafana/ {
        limit_req zone=grafana_general burst=90 nodelay;
        limit_conn conn_limit 50;

        # HTTP-Methoden: Volle REST-API (GET, POST, PUT, DELETE, PATCH)
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
            return 405;
        }

        # Blockiere gefaehrliche Methoden
        if ($blocked_method) {
            return 405;
        }

        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy-Buffering für große JS-Dateien
        proxy_buffering on;
        proxy_buffers 16 256k;          # 16×256k = 4MB
        proxy_buffer_size 256k;         # Initial buffer
        proxy_busy_buffers_size 512k;   # Busy buffers

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Grafana Feature-Flag API Fix
    # Problem: Frontend generiert /apis/... statt /grafana/apis/...
    location ~ ^/apis/features\.grafana\.app/ {
        limit_req zone=grafana_general burst=10 nodelay;

        # Rewrite zu korrektem Pfad
        rewrite ^/apis/(.*)$ /grafana/apis/$1 last;
    }


    # InfluxDB
    location /influxdb/ {
        limit_req zone=influxdb_general burst=40 nodelay;
        limit_conn conn_limit 30;

        if ($request_method !~ ^(GET|POST|DELETE|OPTIONS)$) {
            return 405;
        }

        # Blockiere gefaehrliche Methoden (zusaetzlicher Check)
        if ($blocked_method) {
            return 405;
        }
        proxy_pass http://influxdb:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Erweiterte Timeouts fuer grosse Datenmengen
        client_body_timeout 90s;
        send_timeout 90s;

        # Groesserer Buffer fuer Batch-Writes
        client_max_body_size 20M;
    }

    # Node-RED
    location /nodered/ {
        limit_req zone=nodered_general burst=200 nodelay;
        limit_conn conn_limit 50;

        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|HEAD)$) {
            return 405;
        }

        # Blockiere gefaehrliche Methoden
        if ($blocked_method) {
            return 405;
        }

        proxy_pass http://nodered:1880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy-Buffering für große JS-Dateien
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_buffer_size 256k;
        proxy_busy_buffers_size 512k;

        # Groesserer Buffer fuer Flow-Deployments
        client_max_body_size 20M;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }


    # Statische Inhalte - Nur Lesen erlaubt
    location ~* ^/(?!grafana|nodered|influxdb|prometheus|mqtt).*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        # HTTP-Methoden: Nur GET und HEAD
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Blockiere gefaehrliche Methoden
        if ($blocked_method) {
            return 405;
        }
        # Nur Root-Dateien werden gecacht
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Default location
    location / {
        try_files $uri $uri/ =404;
    }
}
