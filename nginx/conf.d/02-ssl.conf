# SSL-enabled nginx configuration for MintFV
# With Let's Encrypt support


server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # DNS resolver für Docker (127.0.0.11 ist Docker's embedded DNS)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SSL configuration
    # Domain is automatically replaced by mintfv.sh script
    ssl_certificate /etc/letsencrypt/live/mintfv.peddy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mintfv.peddy.net/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    ##add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self';" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://catalogue.nodered.org; frame-ancestors 'self';" always;


    # Hide nginx version
    server_tokens off;

    # Mosquitto MQTT WebSocket reverse proxy
    location /mqtt {
        limit_req zone=mqtt_ws burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # WebSocket keep-alive
        proxy_buffering off;
    }


    location / {
        try_files $uri $uri/ =404;
    }

    # Grafana reverse proxy
    location /grafana/ {
        limit_req zone=grafana_general burst=100 nodelay;
        limit_conn conn_limit 50;

        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support for live updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # InfluxDB 3 Core reverse proxy - UI and APIs (v1/v2 compatibility included)
    location /influxdb/ {
        limit_req zone=influxdb_api burst=50 nodelay;
        limit_conn conn_limit 30;

        set $influxdb_upstream http://influxdb:8181;
        proxy_pass $influxdb_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP 1.1 for API
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Keine URL-Rewriting für InfluxDB 3 (hat keine eigene UI mehr)
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts für long-running queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # InfluxDB API v2 (native Flux API) - expliziter Pfad
    location /influxdb/api/v2/ {
        limit_req zone=influxdb_api burst=50 nodelay;
        limit_conn conn_limit 30;

        set $influxdb_upstream http://influxdb:8181;
        proxy_pass $influxdb_upstream/api/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP 1.1 for API
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts für long-running queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # InfluxDB API v1 (InfluxQL compatibility API)
    location /influxdb/api/v1/ {
        limit_req zone=influxdb_api burst=50 nodelay;
        limit_conn conn_limit 30;

        set $influxdb_upstream http://influxdb:8181;
        proxy_pass $influxdb_upstream/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP 1.1 for API
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts für long-running queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Node-RED reverse proxy
    location /nodered/ {
        limit_req zone=nodered_general burst=50 nodelay;
        limit_conn conn_limit 50;

        set $nodered_upstream http://nodered:1880;
        proxy_pass $nodered_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support für Node-RED Editor
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering für Editor
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Access and error logs to STDOUT/STDERR
    access_log /dev/stdout combined if=$log_healthcheck;
    error_log /dev/stderr warn;
}
server_tokens off;