# SSL-enabled nginx configuration for MintFV
# With Let's Encrypt support


server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # DNS resolver für Docker (127.0.0.11 ist Docker's embedded DNS)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SSL configuration
    # Domain is automatically replaced by mintfv.sh script
    ssl_certificate /etc/letsencrypt/live/mintfv.peddy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mintfv.peddy.net/privkey.pem;


    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header_inherit merge;  # ← GLOBAL aktivieren - ab v1.29.3
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://catalogue.nodered.org; frame-ancestors 'self';" always;

    # Hide nginx version
    server_tokens off;

    # ======================================================================
    # SECURITY LOGIC & ACTION
    # ======================================================================

    ## Initialize variables for this request
    # set $log_reason "";  # set $block_request 0; ---> set in nginx/conf.d/00-security-maps.conf


    # Check URI length (8KB = 8192 bytes)
    if ($request_uri ~ "^.{8192,}") {
        set $log_reason "uri_too_long";
        set $block_request 1;
    }

    # Block HTTP/1.0 (old bots)
    if ($server_protocol = "HTTP/1.0") {
        set $log_reason "http_1.0";
        set $block_request 1;
    }

    # Map-based checks (fast, for exact matches on raw data)
    if ($is_bad_bot)      { set $log_reason "bad_bot";      set $block_request 1; }
    if ($is_bad_uri)      { set $log_reason "bad_uri";      set $block_request 1; }
    if ($is_exploit_uri)  { set $log_reason "exploit_uri";  set $block_request 1; }
    if ($is_bad_signature){ set $log_reason "bad_signature";set $block_request 1; }

    # Pattern-based checks (slower, but works on DECODED variables)
    include /etc/nginx/include.d/security_if_rules.conf;

    # Additional check: Block suspicious HTTP methods
    if ($request_method !~ ^(GET|POST|HEAD)$ ) {
        set $log_reason "bad_method";
        set $block_request 1;
    }

    # Define logging behavior
    access_log /dev/stdout security if=$block_request;
    access_log /dev/stdout combined if=$log_standard_traffic;
    error_log /dev/stderr warn;   # Hier detaillierter, als global in nginx.conf

    # Perform the final action - block if flagged
    if ($block_request) { return 444; }

    # Entferne Backend-Header die Informationen leaken
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;
    proxy_hide_header X-Runtime;


    # ======================================================================
    # LOCATION BLOCKS
    # ======================================================================

    # Grafana
    # location /grafana/login {
    #     limit_req zone=login_limit burst=2 nodelay;
    #     # ... rest wie gehabt
    # }
    location /grafana/ {
        limit_req zone=grafana_general burst=100 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy-Buffering für große JS-Dateien
        proxy_buffering on;
        proxy_buffers 16 256k;          # 16×256k = 4MB
        proxy_buffer_size 256k;         # Initial buffer
        proxy_busy_buffers_size 512k;   # Busy buffers

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # InfluxDB
    location /influxdb/ {
        limit_req zone=influxdb_general burst=50 nodelay;
        limit_conn conn_limit 30;

        set $influxdb_upstream http://influxdb:8086;
        proxy_pass $influxdb_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Node-RED
    location /nodered/ {
        limit_req zone=nodered_general burst=200 nodelay;
        limit_conn conn_limit 50;

        set $nodered_upstream http://nodered:1880;
        proxy_pass $nodered_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy-Buffering für große JS-Dateien
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_buffer_size 256k;
        proxy_busy_buffers_size 512k;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MQTT WebSocket
    location /mqtt {
        limit_req zone=mqtt_general burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Zigbee2MQTT
    location /zigbee2mqtt/ {
        limit_req zone=zigbee2mqtt_general burst=30 nodelay;
        limit_conn conn_limit 20;

        set $zigbee2mqtt_upstream http://zigbee2mqtt:8080;
        proxy_pass $zigbee2mqtt_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }


    # Default location
    location / {
        try_files $uri $uri/ =404;
    }

}
