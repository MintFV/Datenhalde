# ===================================================
# 00-security-maps.conf - Main security logic file
# Defines all mappings. Logic is handled in the server block.
# ===================================================

# --- GLOBAL VARIABLE INITIALIZATION ---
# Initialize variables globally to prevent "uninitialized variable" warnings
# when requests are rejected before reaching the server block (e.g., URI too long)

map $uri $block_request {
    default 0;
}

map $uri $log_reason {
    default "";
}


# Ziel: ALLE Traversal-, Encoding-, Nullbyte- und
# kaputten Requests erkennen, bevor nginx sie
# intern verwirft oder normalisiert.
map $request_uri $is_malformed_uri {
    default 0;

    # --------------------------------------------
    # Doppelte Encodings
    # --------------------------------------------
    "~*%25"                1;
    "~*%2f"                1;
    "~*%5c"                1;
    "~*%00"                1;

    # --------------------------------------------
    # Traversal (klassisch & encoded)
    # --------------------------------------------
    "~*(\\.\\./){2,}"      1;
    "~*(%2e%2e){2,}"       1;

    # --------------------------------------------
    # High-risk Unix paths
    # --------------------------------------------
    "~*/proc/"             1;
    "~*/root/"             1;
    "~*/self/environ"      1;
    "~*/app/\\.env"        1;

    # --------------------------------------------
    # Node/Vite @fs bypass
    # --------------------------------------------
    "~*@fs"                1;


    # alle .. Sequenzen am Anfang (auch wenn nginx sie nicht auflöst)
    "~^/\\.\\./"              1;

    # Ungültige UTF-8 Sequenzen
    "~*%F0%28"                1;
}


# Block based on SQLi patterns in query arguments
map $args $is_sqli {
    default 0;
    include /etc/nginx/security_maps/sqli_patterns.map;
}

# Block based on XSS patterns in URI
map $request_uri $is_xss {
    default 0;
    include /etc/nginx/security_maps/xss_patterns.map;
}


# Block based on User-Agent
map $http_user_agent $is_bad_bot {
    default 0;
    include /etc/nginx/security_maps/bad_bots.map;
}

# Block based on requested URI/path
map $request_uri $is_bad_uri {
    default 0;
    include /etc/nginx/security_maps/scan_uris.map;
    include /etc/nginx/security_maps/sensitive_files.map;
}

# Block based on exploit patterns in URI
map $request_uri $is_exploit_uri {
    default 0;
    include /etc/nginx/security_maps/exploit_payloads.map;
}


# --- 2. Create variables for logging the reason ---
# These will be combined in the server block.
map $is_bad_bot $log_reason_bot { default ""; 1 "bad_bot"; }
map $is_bad_uri $log_reason_uri { default ""; 1 "bad_uri"; }
map $is_exploit_uri $log_reason_exploit { default ""; 1 "exploit_uri"; }
map $is_bad_signature $log_reason_signature { default ""; 1 "bad_signature"; }
map $is_sqli $log_reason_sqli { default ""; 1 "bad_sqli"; }
map $is_xss $log_reason_xss { default ""; 1 "bad_xss"; }



# Block based on method + URI signature
map "$request_method $request_uri" $is_bad_signature {
    default 0;
    include /etc/nginx/security_maps/bad_signatures.map;
}

# --- 2. Create variables for logging the reason ---
# These will be combined in the server block.

map $is_bad_bot $log_reason_bot { default ""; 1 "bad_bot"; }
map $is_bad_uri $log_reason_uri { default ""; 1 "bad_uri"; }
map $is_exploit_uri $log_reason_exploit { default ""; 1 "exploit_uri"; }
map $is_bad_signature $log_reason_signature { default ""; 1 "bad_signature"; }


# Map to control the standard combined log.
# Log, if $block_request is 0 (no security event) AND $log_healthcheck is 1 (not a healthcheck).
map "$block_request$log_healthcheck" $log_standard_traffic {
    "01" 1;
    default 0;
}


###############################################################################
## WHITELIST MAPS - Legitime Pfade NICHT blocken
###############################################################################

# Whitelist für legitime Login/Admin-Pfade
map $request_uri $is_whitelisted_path {
    default 0;

    # Grafana
    "~^/grafana/login" 1;
    "~^/grafana/api/" 1;
    "~^/grafana/admin/" 1;
    "~^/grafana/public/" 1;

    # Node-RED
    "~^/nodered/auth/" 1;
    "~^/nodered/login" 1;

    # InfluxDB
    "~^/influxdb/api/" 1;

    # Let's Encrypt ACME Challenge
    "~^/\.well-known/acme-challenge/" 1;

    # Decap CMS
    "~^/cms/" 1;
    "~^/auth$" 1;
    "~^/callback$" 1;
}

# Kombiniere Whitelist mit bad_uri Check
# Nur blocken wenn: is_bad_uri=1 UND is_whitelisted_path=0
map "$is_bad_uri:$is_whitelisted_path" $is_bad_uri_final {
    default 0;
    "1:0" 1;  # Bad URI + NICHT whitelisted = BLOCK
    "1:1" 0;  # Bad URI + whitelisted = ALLOW
    "0:0" 0;  # Good URI = ALLOW
    "0:1" 0;  # Good URI + whitelisted = ALLOW
}

