# Rate Limiting Configuration for MintFV

# InfluxDB API Rate Limiting - 30 req/s mit Burst 50
limit_req_zone $binary_remote_addr zone=influxdb_api:10m rate=30r/s;

# Grafana General - 50 req/s mit Burst 100
limit_req_zone $binary_remote_addr zone=grafana_general:10m rate=50r/s;

# Grafana Login - 5 req/s mit Burst 10
limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=5r/s;

# Node-RED Editor - 30 req/s mit Burst 50
limit_req_zone $binary_remote_addr zone=nodered_general:10m rate=30r/s;

# Mosquitto MQTT WebSocket - 30 req/s mit Burst 50
limit_req_zone $binary_remote_addr zone=mqtt_ws:10m rate=30r/s;

# General DoS Protection - 200 req/s
limit_req_zone $binary_remote_addr zone=general:10m rate=200r/s;

# Connection Limit
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

limit_req_status 429;

# Zone für Scanner und Bots - sehr streng: 2 Anfragen pro Minute
limit_req_zone $scanner_limit_key zone=scanners:10m rate=2r/m;