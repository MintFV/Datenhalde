# Rate limiting zones
# Format: limit_req_zone key zone=name:size rate=rate;

# General rate limiting per IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Grafana rate limiting
limit_req_zone $binary_remote_addr zone=grafana_general:10m rate=20r/s;

# InfluxDB rate limiting
limit_req_zone $binary_remote_addr zone=influxdb_general:10m rate=10r/s;

# Node-RED rate limiting
limit_req_zone $binary_remote_addr zone=nodered_general:10m rate=10r/s;

# MQTT rate limiting
limit_req_zone $binary_remote_addr zone=mqtt_general:10m rate=5r/s;

# Zigbee2MQTT rate limiting
limit_req_zone $binary_remote_addr zone=zigbee2mqtt_general:10m rate=10r/s;

# Connection limit
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
