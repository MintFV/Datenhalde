# Healthcheck Log Filter (nur für internen Docker-Healthcheck)

# 1. Match user agent "curl"
map $http_user_agent $hc_ua {
    "~*curl" 1;
    default 0;
}

# 2. Match internal Docker IP (healthcheck läuft IM Container)
map $remote_addr $hc_ip {
    "127.0.0.1" 1;
    default 0;
}

# 3. Kombinieren: nur wenn beide == 1 → nicht loggen
map "$hc_ua$hc_ip" $log_healthcheck {
    "11" 0;    # curl + localhost
    default 1; # alles andere loggen
}
