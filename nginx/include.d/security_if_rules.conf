###############################################################################
## Whitlisting Maps
###############################################################################
if ($is_grafana_internal_api) {
    set $is_bad_uri 0;
}


# ======================================================================
# Advanced Security Checks (using 'if' on decoded variables)
# ======================================================================
# This file is included within the server block in 02-ssl.conf.
# Note: $args is NOT URL-decoded, so we need to match both encoded and decoded patterns

# SQLi Pattern 1: UNION-based (match both space and %20)
if ($args ~* "union(%20|\+|\s)+select") {
    set $log_reason "bad_sqli";
    set $block_request 1;
}

# SQLi Pattern 2: Time-based blind
if ($args ~* "benchmark(%20|\+|\s)*\(") {
    set $log_reason "bad_sqli";
    set $block_request 1;
}

# SQLi Pattern 3: Boolean-based blind
if ($args ~* "(%20|\+|\s)+(or|and)(%20|\+|\s)+\w+(%20|\+|\s)*=(%20|\+|\s)*\w+") {
    set $log_reason "bad_sqli";
    set $block_request 1;
}

# SQLi Pattern 4: SQL comments
if ($args ~* "(/\*|--|\#)") {
    set $log_reason "bad_sqli";
    set $block_request 1;
}

# XSS Pattern 1: Script tags (check in request_uri which IS decoded)
if ($request_uri ~* "<script") {
    set $log_reason "bad_xss";
    set $block_request 1;
}

# XSS Pattern 2: Event handlers
if ($request_uri ~* "on(error|load|click|mouse)(%20|\+|\s)*=") {
    set $log_reason "bad_xss";
    set $block_request 1;
}

# XSS Pattern 3: JavaScript protocol
if ($request_uri ~* "javascript(%20|\+|\s)*:") {
    set $log_reason "bad_xss";
    set $block_request 1;
}

# Null byte injection attempt
if ($request_uri ~* "%00") {
    set $log_reason "null_byte_injection";
    set $block_request 1;
}
