
###############################################################################
## SECURITY IF RULES - Angepasst für Whitelist-Logik
###############################################################################

# WICHTIG: Diese Datei muss NACH 00-security-maps.conf geladen werden!

# Kombiniere alle Block-Flags (nutzt is_bad_uri_final statt is_bad_uri)
set $block_request 0;
set $log_reason "";

if ($is_bad_bot) {
    set $block_request 1;
    set $log_reason "bad_bot";
}

if ($is_bad_uri_final) {  # ✅ GEÄNDERT: nutzt is_bad_uri_final (mit Whitelist)
    set $block_request 1;
    set $log_reason "bad_uri";
}

if ($is_exploit_uri) {
    set $block_request 1;
    set $log_reason "exploit_uri";
}

if ($is_bad_signature) {
    set $block_request 1;
    set $log_reason "bad_signature";
}

if ($is_sqli) {
    set $block_request 1;
    set $log_reason "sqli";
}

if ($is_xss) {
    set $block_request 1;
    set $log_reason "xss";
}

# Block wenn Flag gesetzt
if ($block_request) {
    return 444;
}
